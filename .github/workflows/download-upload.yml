name: Download & Upload Telegram Videos

on:
  workflow_dispatch:
    inputs:
      max_size_gb:
        description: '每次下载上限 (GB)'
        required: false
        default: '12'
        type: string
      gdrive_folder:
        description: 'Google Drive 目标文件夹路径'
        required: false
        default: 'TelegramVideos'
        type: string

  schedule:
    # 每6小时 (北京时间 02:00, 08:00, 14:00, 20:00)
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-uploader
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 恢复上次的 Telegram session (避免重复登录) ----
      - name: Restore Telegram session
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: telegram-session

      # ---- 从 Secret 恢复 session (首次运行 / artifact 过期时) ----
      - name: Restore Telegram session from secret
        env:
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
        run: |
          if [ -f downloader.session ]; then
            echo "✅ session restored from artifact"
            exit 0
          fi
          if [ -z "$TG_SESSION_B64" ]; then
            echo "⚠️ No session artifact and TG_SESSION_B64 secret not set"
            echo "⚠️ 首次运行会因无法交互登录而失败!"
            echo "⚠️ 请先本地运行 scripts/login.py 生成 session, base64 后添加 Secret TG_SESSION_B64"
            exit 0
          fi
          echo "$TG_SESSION_B64" | base64 -d > downloader.session
          echo "✅ session restored from TG_SESSION_B64 secret"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---- Google Drive: 从 Secret 解码 Service Account JSON ----
      - name: Setup Google Drive credentials
        env:
          GDRIVE_SA_B64: ${{ secrets.GDRIVE_SA_B64 }}
        run: |
          if [ -z "$GDRIVE_SA_B64" ]; then
            echo "❌ GDRIVE_SA_B64 secret is not set"
            exit 1
          fi
          echo "$GDRIVE_SA_B64" | base64 -d > config/gdrive_service_account.json
          echo "✅ Google Drive Service Account JSON decoded"
          # 提取 SA 邮箱用于日志确认
          python -c "import json; d=json.load(open('config/gdrive_service_account.json')); print(f'SA email: {d.get(\"client_email\", \"N/A\")}')"

      # ---- 下载 Telegram 视频 ----
      - name: Download Telegram videos
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          MAX_SIZE_GB: ${{ github.event.inputs.max_size_gb || '12' }}
        run: |
          python -c "
          import asyncio, os
          from pathlib import Path
          from downloader.telegram_downloader import TelegramVideoDownloader

          async def main():
              api_id = int(os.environ['TG_API_ID'])
              api_hash = os.environ['TG_API_HASH']
              chat_ids = [c.strip() for c in os.environ.get('TG_CHAT_IDS', '').split(',') if c.strip()]
              if not chat_ids:
                  print('❌ TG_CHAT_IDS is empty')
                  return

              max_gb = float(os.environ.get('MAX_SIZE_GB', '12'))
              download_dir = Path('./downloads')
              download_dir.mkdir(parents=True, exist_ok=True)

              dl = TelegramVideoDownloader(
                  api_id=api_id,
                  api_hash=api_hash,
                  download_dir=str(download_dir),
                  max_total_size_gb=max_gb,
                  skip_larger_than_gb=2.0,
              )

              all_files = []
              for chat_id in chat_ids:
                  print(f'📺 Scanning: {chat_id}')
                  files, latest_id = await dl.download_chat_videos(chat_id=chat_id)
                  all_files.extend(files)
                  print(f'  → {len(files)} files, latest_id={latest_id}')

              print(f'📊 Total: {len(all_files)} files, {dl.tracker.downloaded_gb:.2f}GB')

              if all_files:
                  Path('downloads/.filelist').write_text('\\n'.join(str(f) for f in all_files))

          asyncio.run(main())
          "

      # ---- 上传到 Google Drive (按来源分目录) ----
      - name: Upload to Google Drive
        env:
          GDRIVE_FOLDER: ${{ github.event.inputs.gdrive_folder || secrets.GDRIVE_FOLDER || 'TelegramVideos' }}
        run: |
          if [ ! -f downloads/.filelist ]; then
            echo "No files to upload"
            exit 0
          fi

          python -c "
          import os
          from pathlib import Path
          from collections import defaultdict
          from downloader.uploader import GoogleDriveUploader

          filelist = Path('downloads/.filelist').read_text().strip().split('\n')
          files = [Path(f) for f in filelist if f and Path(f).exists()]
          print(f'Uploading {len(files)} files to Google Drive')

          base = os.environ.get('GDRIVE_FOLDER', 'TelegramVideos').strip('/')

          # 按来源子目录分组: downloads/<来源>/<文件>
          groups = defaultdict(list)
          for p in files:
              try:
                  rel = p.relative_to(Path('downloads'))
              except ValueError:
                  rel = p
              source = rel.parts[0] if len(rel.parts) > 1 else ''
              groups[source].append(p)

          uploader = GoogleDriveUploader(
              service_account_file='config/gdrive_service_account.json',
              remote_dir='/' + base,
              delete_after_upload=True,
          )

          if not uploader.test_connection():
              print('❌ Cannot connect to Google Drive')
              exit(1)

          total_success = 0
          total_failed = 0
          for source, group_files in groups.items():
              sub = base + ('/' + source if source else '')
              label = source if source else '根目录'
              print(f'📤 [{label}] {len(group_files)} 个文件 → /{sub}')
              success, failed = uploader.upload_files(group_files, remote_dir=sub)
              total_success += success
              total_failed += failed

          print(f'☁️ Google Drive upload: {total_success} success, {total_failed} failed')

          if total_failed > 0:
              exit(1)
          "

      # ---- 保存 session 供下次复用 ----
      - name: Save Telegram session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-session
          path: |
            downloader.session
            downloader.session-journal
          retention-days: 7
