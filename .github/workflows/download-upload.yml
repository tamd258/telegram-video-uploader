name: Download & Upload Telegram Videos

on:
  workflow_dispatch:
    inputs:
      max_size_gb:
        description: '每次下载上限 (GB)'
        required: false
        default: '12'
        type: string

  schedule:
    # 每6小时 (北京时间 02:00, 08:00, 14:00, 20:00)
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-uploader
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 恢复上次的 Telegram session (避免重复登录) ----
      - name: Restore Telegram session
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: telegram-session

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---- alist: 中国移动云盘 WebDAV 桥 ----
      - name: Setup alist
        env:
          MCLOUD_AUTH: ${{ secrets.MCLOUD_AUTHORIZATION }}
          ALIST_PASSWORD: ${{ secrets.ALIST_ADMIN_PASSWORD }}
        run: |
          ALIST_VERSION="3.42.0"
          mkdir -p /tmp/alist
          curl -fsSL "https://github.com/AlistGo/alist/releases/download/v${ALIST_VERSION}/alist-linux-amd64.tar.gz" \
            -o /tmp/alist.tar.gz
          tar -xzf /tmp/alist.tar.gz -C /tmp/alist
          chmod +x /tmp/alist/alist

          # 动态生成 alist config.json (只需改 authorization 字段)
          mkdir -p /tmp/alist/data
          cat > /tmp/alist/data/config.json << JSONEOF
          {
            "force": false,
            "site_url": "",
            "cdn": "",
            "jwt_secret": "random_$(date +%s)",
            "token_expires_in": 48,
            "scheme": {
              "address": "0.0.0.0",
              "http_port": 5244,
              "https_port": -1,
              "force_https": false,
              "cert_file": "",
              "key_file": ""
            },
            "temp_dir": "data/temp",
            "log": {
              "enable": true,
              "name": "data/log/log.log",
              "max_size": 50,
              "max_backups": 30,
              "max_age": 28,
              "compress": false
            },
            "max_connections": 0,
            "tls_insecure_skip_verify": false,
            "storages": [
              {
                "driver": "139",
                "mount_path": "/mcloud",
                "type": "new_cloud",
                "authorization": "$MCLOUD_AUTH",
                "root_folder_id": "",
                "cloud_id": "",
                "upload_part_size": 20971520,
                "remove_way": "trash",
                "webdav_policy": "native_proxy",
                "webdav_proxy": true
              }
            ]
          }
          JSONEOF

          # 设置管理员密码 & 启动
          cd /tmp/alist
          ./alist admin set "$ALIST_PASSWORD"
          nohup ./alist server > /tmp/alist.log 2>&1 &
          echo "alist PID: $!"

          sleep 5
          if curl -s http://localhost:5244/api/public/settings > /dev/null; then
            echo "✅ alist started"
          else
            echo "❌ alist failed to start"
            cat /tmp/alist.log
            exit 1
          fi

      # ---- rclone: 通过 WebDAV 连接 alist ----
      - name: Setup rclone
        env:
          ALIST_PASSWORD: ${{ secrets.ALIST_ADMIN_PASSWORD }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '[mcloud]\ntype = webdav\nurl = http://localhost:5244/dav\nvendor = other\nuser = admin\npass = %s\n' \
            "$ALIST_PASSWORD" > ~/.config/rclone/rclone.conf
          rclone lsd mcloud: || echo "⚠️ 云盘目录为空或首次使用"

      # ---- 下载 Telegram 视频 ----
      - name: Download Telegram videos
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          MAX_SIZE_GB: ${{ github.event.inputs.max_size_gb || '12' }}
        run: |
          python -c "
          import asyncio, os
          from pathlib import Path
          from downloader.telegram_downloader import TelegramVideoDownloader

          async def main():
              api_id = int(os.environ['TG_API_ID'])
              api_hash = os.environ['TG_API_HASH']
              chat_ids = [c.strip() for c in os.environ.get('TG_CHAT_IDS', '').split(',') if c.strip()]
              if not chat_ids:
                  print('❌ TG_CHAT_IDS is empty')
                  return

              max_gb = float(os.environ.get('MAX_SIZE_GB', '12'))
              download_dir = Path('./downloads')
              download_dir.mkdir(parents=True, exist_ok=True)

              dl = TelegramVideoDownloader(
                  api_id=api_id,
                  api_hash=api_hash,
                  download_dir=str(download_dir),
                  max_total_size_gb=max_gb,
                  skip_larger_than_gb=2.0,
              )

              all_files = []
              for chat_id in chat_ids:
                  print(f'📺 Scanning: {chat_id}')
                  files, latest_id = await dl.download_chat_videos(chat_id=chat_id)
                  all_files.extend(files)
                  print(f'  → {len(files)} files, latest_id={latest_id}')

              print(f'📊 Total: {len(all_files)} files, {dl.tracker.downloaded_gb:.2f}GB')

              if all_files:
                  Path('downloads/.filelist').write_text('\\n'.join(str(f) for f in all_files))

          asyncio.run(main())
          "

      # ---- 上传到中国移动云盘 ----
      - name: Upload to cloud
        run: |
          if [ ! -f downloads/.filelist ]; then
            echo "No files to upload"
            exit 0
          fi

          python -c "
          from pathlib import Path
          from downloader.uploader import RcloneUploader

          filelist = Path('downloads/.filelist').read_text().strip().split('\\n')
          files = [Path(f) for f in filelist if f and Path(f).exists()]
          print(f'Uploading {len(files)} files')

          uploader = RcloneUploader(
              remote_name='mcloud',
              remote_dir='/aaa',
              delete_after_upload=True,
          )

          if not uploader.test_connection():
              print('❌ Cannot connect to cloud drive')
              exit(1)

          success, failed = uploader.upload_files(files)
          print(f'☁️ Upload: {success} success, {failed} failed')
          "

      # ---- 保存 session 供下次复用 ----
      - name: Save Telegram session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-session
          path: |
            downloader.session
            downloader.session-journal
          retention-days: 7
